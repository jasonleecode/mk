# BeagleBone Black (AM335x) platform configuration
# Variable names must match what l4mk/mk/Makeconf and l4mk/Makefile expect.

PLATFORM_NAME        = "BeagleBone Black (AM335x)"
PLATFORM_ARCH        = arm
PLATFORM_RAM_BASE    = 0x80000000
PLATFORM_RAM_SIZE_MB = 512

# UART for console output (UART0 on AM335x)
UART_BASE := 0x44e09000
UART_BAUD := 115200

# GPIO base for DS18B20 temperature sensor
GPIO_BASE := 0x4804c000

# I2C base for TEF6686HN radio (I2C1 on AM335x)
I2C_BASE := 0x4802a000

# Disable QEMU-specific options
CONFIG_QEMU :=
